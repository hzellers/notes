<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Notepad</title>
  <meta name="theme-color" content="#2b5a3c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header>
    <h1>Notepad</h1>
    <span id="backup-indicator" class="backup-indicator"></span>
  </header>
  <div id="token-warning-banner" class="token-warning" hidden></div>
  <button type="button" id="stale-banner" class="stale-banner" hidden>
    A newer version opened in another tab — tap to reload
  </button>
  <div id="update-overlay" class="update-overlay" role="status" aria-live="polite" hidden>
    <div class="update-overlay-inner">
      <div class="update-spinner" aria-hidden="true"></div>
      <p>Updating to the new version…</p>
    </div>
  </div>
  <main>
    <section id="capture-section">
      <textarea
        class="capture-input"
        id="capture-input"
        placeholder="Capture a thought…"
        autofocus
      ></textarea>
      <div class="capture-actions">
        <button type="button" id="save-text-btn">Save</button>
        <button type="button" id="toggle-ink-btn">Sketch</button>
      </div>
      <div id="ink-panel" hidden>
        <canvas id="ink-canvas" class="ink-canvas"></canvas>
        <div class="capture-actions">
          <button type="button" id="save-ink-btn">Save sketch</button>
          <button type="button" id="clear-ink-btn">Clear</button>
          <button type="button" id="cancel-ink-btn">Cancel</button>
        </div>
      </div>
      <p id="capture-error" class="capture-error" hidden></p>
    </section>
    <section id="inbox-section">
      <h2 id="inbox-heading">Inbox (0)</h2>
      <ul id="inbox-list" class="inbox-list"></ul>
    </section>
    <section id="everything-section">
      <h2 id="everything-heading">Notes &amp; diagrams (0)</h2>
      <ul id="everything-list" class="everything-list"></ul>
    </section>
  </main>
  <button type="button" id="settings-fab" class="settings-fab" aria-label="Settings">⚙</button>
  <div id="settings-panel" class="settings-panel">
    <div class="settings-panel-inner">
      <h2>Settings</h2>

      <label class="settings-label" for="pat-input">GitHub token (fine-grained PAT)</label>
      <div class="pat-row">
        <input type="password" id="pat-input" class="settings-input" autocomplete="off" />
        <button type="button" id="toggle-pat-btn" class="pat-toggle">Show</button>
      </div>

      <label class="settings-label" for="repo-input">Data repo (owner/repo)</label>
      <input type="text" id="repo-input" class="settings-input" placeholder="owner/notes-data" />

      <label class="settings-label" for="expiry-input">Token expires</label>
      <input type="date" id="expiry-input" class="settings-input" />

      <div class="capture-actions">
        <button type="button" id="save-settings-btn">Save</button>
        <button type="button" id="backup-now-btn">Back up now</button>
      </div>
      <p id="backup-status-detail" class="backup-status-detail"></p>

      <div class="settings-divider"></div>

      <div class="capture-actions">
        <button type="button" id="export-btn">Export JSON</button>
        <button type="button" id="import-btn">Import…</button>
      </div>
      <p id="export-status" class="backup-status-detail"></p>
      <input type="file" id="import-input" accept="application/json" hidden />
      <p id="import-status" class="backup-status-detail"></p>
    </div>
  </div>
  <div id="editor-panel" class="editor-panel">
    <div class="editor-panel-inner">
      <h2 id="editor-heading">New note</h2>

      <details id="editor-sketch-details" class="editor-sketch" hidden>
        <summary>Original sketch</summary>
        <div id="editor-sketch-content" class="editor-sketch-content"></div>
      </details>

      <label class="settings-label" for="editor-title-input">Title</label>
      <input type="text" id="editor-title-input" class="settings-input" placeholder="Optional title" />

      <label class="settings-label" id="editor-body-label" for="editor-body-input">Note</label>
      <textarea id="editor-body-input" class="settings-input editor-body-input" rows="6"></textarea>

      <div id="editor-preview-wrap" class="editor-preview-wrap" hidden>
        <div id="editor-preview" class="editor-preview"></div>
        <p id="editor-error" class="editor-error" hidden></p>
      </div>

      <p id="editor-status" class="backup-status-detail"></p>
      <div class="capture-actions">
        <button type="button" id="editor-save-btn">Save</button>
        <button type="button" id="editor-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>
  <footer id="debug-indicator"></footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
