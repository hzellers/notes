<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Notepad</title>
  <meta name="theme-color" content="#2b5a3c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header>
    <h1>Notepad</h1>
  </header>
  <main>
    <section id="capture-section">
      <textarea
        class="capture-input"
        id="capture-input"
        placeholder="Capture a thought…"
        autofocus
      ></textarea>
      <div class="capture-actions">
        <button type="button" id="save-text-btn">Save</button>
        <button type="button" id="toggle-ink-btn">Sketch</button>
      </div>
      <div id="ink-panel" hidden>
        <canvas id="ink-canvas" class="ink-canvas"></canvas>
        <div class="capture-actions">
          <button type="button" id="save-ink-btn">Save sketch</button>
          <button type="button" id="clear-ink-btn">Clear</button>
          <button type="button" id="cancel-ink-btn">Cancel</button>
        </div>
      </div>
    </section>
    <section id="inbox-section">
      <h2 id="inbox-heading">Inbox (0)</h2>
      <ul id="inbox-list" class="inbox-list"></ul>
    </section>
  </main>
  <footer id="debug-indicator"></footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
